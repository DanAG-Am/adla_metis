[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-brain"
version = "0.1.0"
description = "A local, domain-specific LLM for business analytics."
requires-python = ">=3.11"
dependencies = [
    "torch",
    "pyyaml",
    "tokenizers"
]

[project.scripts]
business-brain = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["llm*", "agent*", "bql*"]
